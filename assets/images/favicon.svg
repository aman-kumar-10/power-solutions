<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Crisp Clean Background Badge matching the Logo's White Canvas -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#D1E2D7" stroke-width="1.5" fill="none"/>

  <!-- Brand Symbol (Centered: exact paths and colors from logo.svg) -->
  <g transform="translate(4.5, 2)">
    <!-- Subtle Circuit Nodes -->
    <circle cx="8" cy="18" r="2" fill="#0E793C" opacity="0.4"/>
    <line x1="8" y1="18" x2="16" y2="18" stroke="#0E793C" stroke-width="1" stroke-dasharray="2 2" opacity="0.4"/>
    <circle cx="48" cy="50" r="2" fill="#FEBF01" opacity="0.6"/>

    <!-- P Monogram Letterform (Deep Industrial Forest Green: #024F16) -->
    <path d="M14 6 C14 3.79 15.79 2 18 2 H35 C46.046 2 55 10.954 55 22 C55 33.046 46.046 42 35 42 H26 V56 C26 58.21 24.21 60 22 60 H18 C15.79 60 14 58.21 14 56 V6 Z" fill="#024F16"/>
    
    <!-- P Inner Cutout (Crisp White) -->
    <path d="M26 12 H34 C39.523 12 44 16.477 44 22 C44 27.523 39.523 32 34 32 H26 V12 Z" fill="#FFFFFF"/>

    <!-- Electric Lightning Bolt (Vibrant Electric Amber Gold: #FEBF01) -->
    <path d="M48 3 L20 30 H32 L16 57 L44 26 H31 L48 3 Z" fill="#FEBF01" filter="drop-shadow(0 2px 3px rgba(0, 0, 0, 0.15))"/>
    
    <!-- Bolt Inner Highlight (#FFF176) -->
    <path d="M38 10 L25 28 H33 L23 48 L40 25 H30 L38 10 Z" fill="#FFF176" opacity="0.75"/>
  </g>
</svg>
